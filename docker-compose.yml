#version: '3.9'

services:
  web:
    image: php:8.2-apache
    container_name: php_web_app
    ports:
      - "3000:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    environment:
      - MYSQL_HOST=${DB_HOST:-db}
      - MYSQL_USER=${DB_USER:-root}
      - MYSQL_PASSWORD=${DB_PASSWORD:-secret}
      - MYSQL_DATABASE=${DB_NAME:-myapp_db}
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      #MYSQL_USER: ${DB_USER}
      #MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init/001-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql
      - ./db/init/002-seed-dev.sql:/docker-entrypoint-initdb.d/002-seed.sql
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
